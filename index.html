<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación: Nayeli & Emilio 🤍</title>
    <style>
        body { 
            text-align: center; 
            background-color: #eae6e1; 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif;
        }

        .invitacion-container {
            position: relative;
            width: 100%;
            max-width: 450px; 
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.15);
        }

        video {
            width: 100%;
            display: block;
        }

        .wrapper-imagen {
            position: relative;
            width: 100%;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ESTILO GENERAL DE LOS BOTONES INVISIBLES */
        .boton-invisible {
            position: absolute;
            cursor: pointer;
            display: block;
            /* NOTA: Están en rojo transparente (0.4) para que veas dónde caen en tu pantalla. */
            /* Cuando queden perfectos, cambia el 0.4 de abajo por 0 para hacerlos invisibles */
            background-color: rgba(255, 0, 0, 0.4); 
        }

        /* AJUSTA ESTOS PORCENTAJES SI SE ADELANTAN O ATRASAN EN TU IMAGEN */
        .btn-ubicacion { top: 35%; left: 8%; width: 84%; height: 2.2%; }
        .btn-regalos   { top: 70%; left: 6%; width: 88%; height: 6.8%; }
        .btn-novio     { top: 82%; left: 15%; width: 32%; height: 1.8%; }
        .btn-novia     { top: 82%; left: 53%; width: 32%; height: 1.8%; }
        .btn-hospedaje { top: 88%; left: 15%; width: 70%; height: 1.8%; }
    </style>
</head>
<body>

    <div class="invitacion-container">

        <!-- 1. VIDEO MP4 (Se reproduce una vez y queda fijo) -->
        <video autoplay muted playsinline>
            <source src="video.mp4" type="video/mp4">
            Tu navegador no soporta videos.
        </video>

        <!-- 2. CONTENEDOR DE LA IMAGEN CON LOS BOTONES ENLAZADOS -->
        <div class="wrapper-imagen">
            <img src="invitacion.png" alt="Invitación">

            <!-- BOTÓN 1: UBICACIÓN -->
            <a href="https://google.com" target="_blank" class="boton-invisible btn-ubicacion" title="Ver Ubicación"></a>

            <!-- BOTÓN 2: MESA DE REGALOS -->
            <a href="https://liverpool.com.mx" target="_blank" class="boton-invisible btn-regalos" title="Mesa de Regalos"></a>

            <!-- BOTÓN 3: CONFIRMAR NOVIO -->
            <a href="https://wa.me" target="_blank" class="boton-invisible btn-novio" title="Confirmar con Emilio"></a>

            <!-- BOTÓN 4: CONFIRMAR NOVIA -->
            <a href="https://wa.me" target="_blank" class="boton-invisible btn-novia" title="Confirmar con Nayeli"></a>

            <!-- BOTÓN 5: HOSPEDAJE -->
            <a href="https://airbnb.mx" target="_blank" class="boton-invisible btn-hospedaje" title="Ver Hospedaje"></a>
        </div>

    </div>

</body>
</html>
