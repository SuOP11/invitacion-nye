<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ed">
  <title>Invitación | NyE</title>
  <meta name="description" content="Te invitamos a celebrar con nosotros.">
  <style>
    :root {
      --paper: #f7f3ed;
      --ink: #3d3935;
      --accent: #8b7462;
      --button: #6f5a4b;
      --button-text: #fffdf9;
      --line: #ded4c9;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px 36px;
    }
    .video-wrap {
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      background: #e8e0d7;
      border-radius: 0 0 4px 4px;
    }
    video {
      display: block;
      width: 100%;
      max-height: 88vh;
      object-fit: contain;
      background: #e8e0d7;
    }
    .intro {
      text-align: center;
      padding: 28px 12px 20px;
    }
    .eyebrow {
      margin: 0 0 10px;
      font: 11px/1.5 Arial, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 42px);
      font-weight: normal;
      line-height: 1.2;
    }
    .subtitle {
      margin: 12px 0 0;
      font-size: 16px;
      line-height: 1.6;
    }
    .invite-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 24px;
      border: 0;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 11px;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 0 22px;
    }
    .action {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 14px 18px;
      border: 1px solid var(--button);
      border-radius: 3px;
      background: var(--button);
      color: var(--button-text);
      text-align: center;
      text-decoration: none;
      font: 600 13px/1.3 Arial, sans-serif;
      letter-spacing: .04em;
      transition: opacity .2s ease;
    }
    .action.secondary {
      color: var(--button);
      background: transparent;
    }
    .action:focus-visible { outline: 3px solid #bca38e; outline-offset: 3px; }
    .action:hover { opacity: .82; }
    footer {
      padding: 8px 0 0;
      text-align: center;
      color: var(--accent);
      font: 11px/1.6 Arial, sans-serif;
      letter-spacing: .08em;
    }
    @media (min-width: 560px) {
      .page { padding-left: 24px; padding-right: 24px; }
      .actions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="video-wrap">
      <!-- Cambia INTRO_NyE.mp4 si el archivo tiene otro nombre. -->
      <video controls autoplay muted playsinline preload="metadata" poster="invitacion.jpg">
        <source src="INTRO_NyE.mp4" type="video/mp4">
        Tu navegador no puede reproducir este video. Puedes continuar con la invitación que aparece abajo.
      </video>
    </div>

    <section class="intro" aria-label="Introducción de la invitación">
      <p class="eyebrow">Con mucho cariño</p>
      <h1>¡Nos encantará compartir este día contigo!</h1>
      <p class="subtitle">Consulta los detalles y confirma tu asistencia en los siguientes enlaces.</p>
    </section>

    <!-- Cambia invitacion.jpg por el nombre exacto de tu imagen. -->
    <img class="invite-image" src="invitacion.jpg" alt="Diseño de la invitación" loading="lazy">

    <nav class="actions" aria-label="Enlaces de la invitación">
      <!-- Reemplaza cada URL de ejemplo antes de publicar. -->
      <a class="action" href="https://wa.me/521XXXXXXXXXX?text=Hola%2C%20quiero%20confirmar%20mi%20asistencia" target="_blank" rel="noopener noreferrer">Confirmar por WhatsApp</a>
      <a class="action secondary" href="https://maps.google.com/?q=AGREGA_AQUI_LA_DIRECCION" target="_blank" rel="noopener noreferrer">Ver ubicación</a>
      <a class="action secondary" href="https://forms.google.com/" target="_blank" rel="noopener noreferrer">Confirmar asistencia</a>
      <a class="action" href="https://AGREGA-AQUI-EL-ENLACE-DE-MESA-DE-REGALOS" target="_blank" rel="noopener noreferrer">Mesa de regalos</a>
    </nav>

    <footer>Gracias por acompañarnos</footer>
  </main>
</body>
</html>
