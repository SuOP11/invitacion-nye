<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación: Nayeli & Emilio 🤍</title>
    <style>
        body { 
            text-align: center; 
            background-color: #eae6e1; 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif;
        }

        /* Contenedor principal relativo para posicionar los botones encima */
        .invitacion-container {
            position: relative;
            width: 100%;
            max-width: 450px; 
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.15);
        }

        video {
            width: 100%;
            display: block;
        }

        .wrapper-imagen {
            position: relative;
            width: 100%;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ESTILO GENERAL DE LOS BOTONES INVISIBLES */
        .boton-invisible {
            position: absolute;
            background-color: rgba(255, 0, 0, 0); /* Totalmente transparente */
            cursor: pointer;
            display: block;
            /* Descomenta la línea de abajo si quieres verlos en color rojo para pruebas */
            /* background-color: rgba(255, 0, 0, 0.3); */ 
        }

        /* POSICIONAMIENTO EXACTO DE CADA BOTÓN (En porcentajes) */
        .btn-ubicacion { top: 38%; left: 8%; width: 84%; height: 5%; }
        .btn-regalos { top: 76.5%; left: 6%; width: 88%; height: 11.5%; }
        .btn-novio { top: 92%; left: 16%; width: 31%; height: 3.5%; }
        .btn-novia { top: 92%; left: 52%; width: 31%; height: 3.5%; }
        .btn-hospedaje { top: 96.5%; left: 15%; width: 70%; height: 3.5%; }
    </style>
</head>
<body>

    <div class="invitacion-container">

        <!-- 1. VIDEO MP4 (Se reproduce una sola vez y queda fijo) -->
        <video autoplay muted playsinline>
            <source src="video.mp4" type="video/mp4">
            Tu navegador no soporta videos.
        </video>

        <!-- 2. CONTENEDOR DE LA IMAGEN Y SUS BOTONES -->
        <div class="wrapper-imagen">
            <img src="invitacion.png" alt="Invitación">

            <!-- BOTÓN 1: UBICACIÓN QUINTA SANTA MARÍA -->
            <a href="https://google.com" target="_blank" class="boton-invisible btn-ubicacion" title="Ver Ubicación"></a>

            <!-- BOTÓN 2: MESA DE REGALOS LIVERPOOL -->
            <a href="https://liverpool.com.mx" target="_blank" class="boton-invisible btn-regalos" title="Mesa de Regalos"></a>

            <!-- BOTÓN 3: CONFIRMAR NOVIO -->
            <a href="https://wa.me" target="_blank" class="boton-invisible btn-novio" title="Confirmar con Novio"></a>

            <!-- BOTÓN 4: CONFIRMAR NOVIA -->
            <a href="https://wa.me" target="_blank" class="boton-invisible btn-novia" title="Confirmar con Novia"></a>

            <!-- BOTÓN 5: HOSPEDAJE AIRBNB -->
            <a href="https://airbnb.mx" target="_blank" class="boton-invisible btn-hospedaje" title="Ver Opciones de Hospedaje"></a>
        </div>

    </div>

</body>
</html>
